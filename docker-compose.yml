version: "3.8"

services:
  ruhgen-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ruhgen_platform
    restart: always
    ports:
      - "3000:3000"
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_PORT=4000
      - DATA_DIR=/app/backend/data
    volumes:
      - ruhgen_data:/app/backend/data
      - ruhgen_media:/app/media
      - ruhgen_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  ruhgen_data:
  ruhgen_media:
  ruhgen_logs:
